[mgr]
show_hidden = true

[opener]
neovim = [
  { run = 'nvim "%s"', block = true, desc = "Neovim" },
]
vscode = [
  { run = 'code "%s"', orphan = true, desc = "VSCode" },
]
reveal = [
  { run = 'thunar "$(dirname "%s")"', orphan = true, desc = "Reveal in Thunar" },
]
mpv = [
  { run = 'mpv "%s"', orphan = true, desc = "Watch with MPV" },
]
run_script = [
  { run = '%s', block = true, desc = "Run script" }
]
execute = [
  { run = '%s', orphan = true, desc = "Execute" }
]
umu = [
  { run = 'footclient umu-run "%s"', orphan = true, desc = "umu-run" }
]
extract_with_ouch = [
  { run = 'ouch decompress "%s"', block = false, desc = "Extract here (ouch)" }
]
losslesscut = [
    { run = 'losslesscut "%s"', orphan = true, desc = "Open with losslesscut" }
]

[open]
prepend_rules = [
  { url = "*.sh", use = [ "neovim", "vscode", "run_script"] },
  { url = "*.exe", use = [ "umu" ] },
  { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", use = [ "extract_with_ouch", "reveal" ] },
  { mime = "application/{executable,pie-executable}", use = [ "execute", "reveal" ]},
  { mime = "text/*", use = [ "neovim", "vscode" ] },
  { mime = "video/*", use = [ "mpv", "losslesscut" ] },
  { mime = "audio/*", use = "mpv" },
]

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"
